name: Build Mumbai Darshan Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mumbai Darshan.zip'
      - '.github/workflows/build-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website project
        run: |
          mkdir app
          unzip -q "Mumbai Darshan.zip" -d app
          test -f app/package.json
          test -f app/vite.config.ts

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build actual React website
        working-directory: app
        run: npm run build -- --base=./

      - name: Upload compiled preview files
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-darshan-react-preview
          path: app/dist/
          if-no-files-found: error
          retention-days: 7
