name: Build Mumbai Darshan Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mumbai Darshan.zip'
      - '.github/workflows/build-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract website project
        run: |
          mkdir app
          unzip -q "Mumbai Darshan.zip" -d app
          test -f app/package.json
          test -f app/vite.config.ts

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build actual React website
        working-directory: app
        run: npm run build -- --base=./

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview build
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
