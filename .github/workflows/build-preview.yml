name: Build Mumbai Darshan Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mumbai_Darshan_Update_85_Attraction_Ticket_Prices.zip'
      - '.github/workflows/build-preview.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract latest Update 85 website project
        run: |
          mkdir app
          unzip -q "Mumbai_Darshan_Update_85_Attraction_Ticket_Prices.zip" -d app
          test -f app/package.json
          test -f app/vite.config.ts

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build actual React website
        working-directory: app
        run: npm run build -- --base=./

      - name: Upload compiled preview files
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-darshan-update-85-preview
          path: app/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish preview files to a separate public branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: app/dist
          force_orphan: true
